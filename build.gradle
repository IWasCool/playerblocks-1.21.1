plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = mod_version
group = mod_group_id
base.archivesName = mod_id

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven {
        name = 'EngineHub'
        url = 'https://maven.enginehub.org/repo/'
        // WorldEdit's Gradle metadata pins Mojang libraries to a different patch version.
        metadataSources {
            mavenPom()
            ignoreGradleMetadataRedirection()
            artifact()
        }
        content {
            includeGroupByRegex 'com\\.sk89q\\..*'
            includeGroupByRegex 'org\\.enginehub\\..*'
        }
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com/'
        content { includeGroup 'mezz.jei' }
    }
}

dependencies {
    // Optional integration APIs; neither mod is bundled or required at runtime.
    compileOnly "com.sk89q.worldedit:worldedit-neoforge-mc1.21:${worldedit_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
}

neoForge.version = project.neo_version
apply from: 'gradle/gametest.gradle'
apply from: 'gradle/verification.gradle'

neoForge {
    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gametest)
        }
    }
}

// Install locally supplied test mods into the ordinary development instance.
tasks.register('installLocalMods', Copy) {
    from('libs') { include 'create-*.jar', 'jei-*.jar' }
    into layout.projectDirectory.dir('run/mods')
}

tasks.matching { it.name in ['runClient', 'runServer', 'prepareClientRun', 'prepareServerRun'] }.configureEach {
    dependsOn tasks.named('installLocalMods')
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def properties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version            : neo_version,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version
    ]
    inputs.properties properties
    expand properties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

idea.module {
    downloadSources = true
    downloadJavadoc = true
}
