name: Build and test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node.js for resource checks
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check resource files
        run: |
          node tools/assets/check-shape-assets.cjs
          node tools/localization/check-localizations.cjs
          node tools/dev/check-project.cjs

      - name: Build and run GameTests
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon runGameTestServer build

      - name: Upload mod and sources
        uses: actions/upload-artifact@v4
        with:
          name: player-blocks
          path: build/libs/*.jar
          if-no-files-found: error
